# Settings for jukebox-stream (installed as /etc/jukebox-stream.conf).
# After editing:  sudo systemctl restart jukebox-stream

# ALSA capture device. "arecord -l" lists devices. The HiFiBerry DAC+ ADC Pro
# shows up as card "sndrpihifiberry".
CAPTURE_DEVICE=hw:CARD=sndrpihifiberry,DEV=0

# 44100 matches AirPlay, so nothing gets resampled.
SAMPLE_RATE=44100

# Named pipe that OwnTone watches. Must be inside OwnTone's library directory.
FIFO=/srv/music/jukebox

# gated  = stream only while a record is playing (frees the speakers otherwise)
# always = stream continuously
MODE=gated

# Gated mode thresholds, in dBFS (0 = full scale). Use "jukebox-stream.py
# --monitor" to see your levels. Set START a bit below the quietest music and
# STOP a few dB above the noise floor between records.
START_THRESHOLD_DB=-40
STOP_THRESHOLD_DB=-50

# How long the level must stay above START before streaming begins (seconds).
START_HOLD_SECONDS=0.3

# How long it must stay below STOP before streaming ends (seconds). Long enough
# to cover the gap while the jukebox changes records if you want one continuous
# session, or shorter if you want it to stop between every record.
STOP_AFTER_SECONDS=30

# Audio kept from just before detection, so the start of a song isn't clipped.
PREROLL_SECONDS=1.0

# Speakers to select in OwnTone when a jukebox session starts, separated by
# commas. A name matches if the speaker's name in OwnTone starts with it.
# At the start of each session the streamer retries every 5 seconds until all
# of these are selected (covering speakers that appear on the network late),
# then leaves them alone, so Spotify, Alexa etc. can take over mid-record.
# When the session ends, OwnTone is stopped so the speakers are released.
# Leave empty to manage speakers only from OwnTone's web page.
SPEAKERS=EDIFIER_S1000W
